name: Linux Secret Service Gate

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-service:
    name: Secret Service / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - dmd-2.111.0
          - ldc-1.41.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsecret-1-dev \
            gnome-keyring \
            dbus-x11

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Backend unavailable fails closed
        shell: bash
        run: |
          DBUS_SESSION_BUS_ADDRESS="unix:path=$RUNNER_TEMP/credentials-d-no-bus" \
            dub run \
              --root=tests/linux-secret-service-integration \
              --compiler="$DC" \
              --force \
              -- \
              --expect-unavailable

      - name: Native Secret Service integration
        shell: bash
        env:
          TEST_HOME: ${{ runner.temp }}/credentials-d-keyring-home
          TEST_RUNTIME: ${{ runner.temp }}/credentials-d-keyring-runtime
        run: |
          rm -rf "$TEST_HOME" "$TEST_RUNTIME"
          mkdir -p "$TEST_HOME" "$TEST_RUNTIME"
          chmod 700 "$TEST_HOME" "$TEST_RUNTIME"

          dbus-run-session -- bash -euo pipefail -c '
            export HOME="$TEST_HOME"
            export XDG_DATA_HOME="$HOME/.local/share"
            export XDG_RUNTIME_DIR="$TEST_RUNTIME"
            mkdir -p "$XDG_DATA_HOME"

            printf "%s" "credentials-d-ci-keyring" |
              gnome-keyring-daemon \
                --unlock \
                --components=secrets \
                >/dev/null

            dub run \
              --root=tests/linux-secret-service-integration \
              --compiler="$DC" \
              --force
          '
