name: Release Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-matrix:
    name: Release / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        compiler:
          - dmd-2.111.0
          - dmd-2.112.1
          - dmd-2.113.0
          - ldc-1.41.0
          - ldc-1.42.0
          - ldc-1.43.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: External consumer smoke
        shell: bash
        run: dub run --root=tests/consumer --compiler="$DC" --force

      - name: Release build
        shell: bash
        run: dub build --build=release --compiler="$DC" --force
