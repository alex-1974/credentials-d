name: Platform Gate

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-platform:
    name: Native / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            compiler: dmd-2.111.0
          - os: windows-2025
            compiler: ldc-1.41.0
          - os: macos-15-intel
            compiler: ldc-1.41.0
          - os: macos-15-intel
            compiler: dmd-2.113.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Compiler versions
        shell: bash
        run: |
          echo "DC=$DC"
          "$DC" --version
          dub --version

      - name: Unit tests
        shell: bash
        run: dub test --compiler="$DC" --force

      - name: External consumer smoke
        shell: bash
        run: dub run --root=tests/consumer --compiler="$DC" --force

      - name: CredentialStore contract
        shell: bash
        run: dub run --root=tests/store-contract --compiler="$DC" --force

      - name: Windows Credential Manager integration
        if: startsWith(matrix.os, 'windows-')
        shell: bash
        run: dub run --root=tests/windows-integration --compiler="$DC" --force

      - name: macOS Data Protection Keychain integration or fail-closed qualification
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        env:
          CREDENTIALS_D_MACOS_UNPROVISIONED_CI: "1"
        run: |
          dub build             --root=tests/macos-data-protection-integration             --compiler="$DC"             --force

          BIN="tests/macos-data-protection-integration/credentials-d-macos-data-protection-integration"

          echo "=== hosted-runner code-signing context ==="
          codesign -dv --verbose=4 "$BIN" 2>&1 || true
          codesign -d --entitlements :- "$BIN" 2>&1 || true

          "$BIN"

      - name: SecretBuffer negative compile contracts
        shell: bash
        run: |
          if dub build \
              --root=tests/compile-negative/secret-implicit-string \
              --compiler="$DC" \
              --force; then
            echo "Expected implicit SecretBuffer -> string conversion to fail."
            false
          fi

          if DFLAGS="-preview=dip1000" dub build \
              --root=tests/compile-negative/secret-scope-escape \
              --compiler="$DC" \
              --force; then
            echo "Expected scoped secret plaintext escape to fail under DIP1000."
            false
          fi

          if dub build \
              --root=tests/compile-negative/secret-copy \
              --compiler="$DC" \
              --force; then
            echo "Expected SecretBuffer copy to fail."
            false
          fi

          if dub build \
              --root=tests/compile-negative/secret-format \
              --compiler="$DC" \
              --force; then
            echo "Expected SecretBuffer formatting to fail."
            false
          fi

      - name: Release build
        shell: bash
        run: dub build --build=release --compiler="$DC" --force
