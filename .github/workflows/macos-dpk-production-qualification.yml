name: macOS DPK Production Qualification

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Provisioned macOS bundle identifier
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-host:
    name: Signed DPK / ${{ matrix.compiler }}
    runs-on: macos-15-intel

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - ldc-1.41.0
          - dmd-2.113.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Require signing inputs
        shell: bash
        env:
          CERTIFICATE_B64: ${{ secrets.MACOS_QUALIFICATION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_QUALIFICATION_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.MACOS_QUALIFICATION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE_B64" || {
            echo "Missing MACOS_QUALIFICATION_CERTIFICATE_P12_BASE64"
            exit 2
          }
          test -n "$CERTIFICATE_PASSWORD" || {
            echo "Missing MACOS_QUALIFICATION_CERTIFICATE_PASSWORD"
            exit 2
          }
          test -n "$PROFILE_B64" || {
            echo "Missing MACOS_QUALIFICATION_PROVISIONING_PROFILE_BASE64"
            exit 2
          }

      - name: Decode signing material
        shell: bash
        env:
          CERTIFICATE_B64: ${{ secrets.MACOS_QUALIFICATION_CERTIFICATE_P12_BASE64 }}
          PROFILE_B64: ${{ secrets.MACOS_QUALIFICATION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          temp.joinpath("qualification.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_B64"])
          )
          temp.joinpath("qualification.provisionprofile").write_bytes(
              base64.b64decode(os.environ["PROFILE_B64"])
          )
          PY

      - name: Create temporary signing keychain
        shell: bash
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_QUALIFICATION_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/credentials-d-qualification.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/qualification.p12" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"

          EXISTING="$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN" |
              awk '/[0-9A-Fa-f]{40}/ {print $2; exit}'
          )"

          test -n "$SIGNING_IDENTITY" || {
            echo "No usable code-signing identity found in imported P12."
            exit 2
          }

          {
            echo "CREDENTIALS_D_MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "CREDENTIALS_D_MACOS_PROVISIONING_PROFILE=$RUNNER_TEMP/qualification.provisionprofile"
            echo "CREDENTIALS_D_MACOS_BUNDLE_ID=${{ inputs.bundle_id }}"
            echo "QUALIFICATION_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Install D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.compiler }}

      - name: Run strict provisioned-host qualification
        shell: bash
        run: |
          DC="$DC" bash qualification/macos-dpk-signed-host/run.sh

      - name: Upload non-secret qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dpk-${{ matrix.compiler }}-${{ github.run_id }}
          path: qualification-results/macos-dpk/
          if-no-files-found: warn
          retention-days: 30

      - name: Destroy temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${QUALIFICATION_KEYCHAIN:-}" ]]; then
            security delete-keychain "$QUALIFICATION_KEYCHAIN" || true
          fi
          rm -f \
            "$RUNNER_TEMP/qualification.p12" \
            "$RUNNER_TEMP/qualification.provisionprofile"
